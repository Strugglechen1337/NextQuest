name: Windows
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: desktop
      - name: Set version from tag
        shell: pwsh
        run: npm version "${env:GITHUB_REF_NAME}" --no-git-tag-version --allow-same-version
        working-directory: desktop
      - name: Build installer
        shell: pwsh
        run: npm run dist -- --publish never
        working-directory: desktop
        env:
          NEXTQUEST_COMMIT: ${{ github.sha }}
      - name: Upload release assets
        shell: pwsh
        working-directory: desktop/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(Get-ChildItem -File | Where-Object { $_.Name -like 'NextQuest-Setup-*.exe' -or $_.Name -like 'NextQuest-Setup-*.exe.blockmap' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.Name })
          if ($files.Count -lt 3) { throw "Erwartete Setup, Blockmap und latest.yml, gefunden: $($files -join ', ')" }
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) { gh release create "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --title "NextQuest $env:GITHUB_REF_NAME" --generate-notes }
          gh release upload "$env:GITHUB_REF_NAME" $files --repo "$env:GITHUB_REPOSITORY" --clobber
          gh release edit "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --draft=false
