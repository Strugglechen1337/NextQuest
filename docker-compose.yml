services:
  nextquest:
    build: .
    image: nextquest:latest
    container_name: nextquest
    restart: unless-stopped
    ports:
      - "${NEXTQUEST_PORT:-3000}:3000"
    environment:
      # Optional: Passwortschutz im Heimnetz (leer = kein Passwort)
      APP_PASSWORD: ${APP_PASSWORD:-}
      TZ: Europe/Berlin
    volumes:
      # Datenbank inkl. Zugangsdaten – bleibt bei Updates erhalten
      - nextquest-data:/data

volumes:
  nextquest-data:
